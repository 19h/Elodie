name: Remind
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    ARCHS: arm64
    DEVELOPMENT_TEAM: 3352WVT944
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # A real identity keeps TCC grants stable across rebuilds.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
packages:
  RemindKit:
    path: Packages/RemindKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  Remind:
    type: application
    platform: macOS
    sources:
      - App
    settings:
      base:
        # Placeholder until the name is cleared. Changing it after release
        # orphans Keychain items and permission grants.
        PRODUCT_BUNDLE_IDENTIFIER: app.remind.Remind.dev
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Remind.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: RemindKit
        product: CoreAPI
      - package: RemindKit
        product: CoreLive
      - package: RemindKit
        product: DesignSystem
      - package: RemindKit
        product: Capture
      - package: RemindKit
        product: Ingest
      - package: RemindKit
        product: TestKit
      - package: RemindKit
        product: CoreFake
      - package: RemindKit
        product: FrameEngine
      - package: RemindKit
        product: OverlayShell
      - package: RemindKit
        product: StripRenderer
      - package: RemindKit
        product: FeatureTimeline
      - package: RemindKit
        product: FeatureSearch
      - package: RemindKit
        product: FeatureOnboarding
      - package: RemindKit
        product: FeatureSettings
      - package: RemindKit
        product: FeatureAsk
      - package: RemindKit
        product: FeatureRecap
      - package: KeyboardShortcuts
    preBuildScripts:
      - name: Build Rust core
        basedOnDependencyAnalysis: false
        script: |
          profile=debug
          [ "$CONFIGURATION" = "Release" ] && profile=release
          "$SRCROOT/scripts/build-core.sh" "$profile"
schemes:
  Remind:
    build:
      targets:
        Remind: all
    run:
      config: Debug
    archive:
      config: Release
