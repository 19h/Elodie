name: Elodie
# Two editions from one codebase. The direct download uses Accessibility, and the App Store
# build is sandboxed and has none of that code. See App/Edition.swift.
configs:
  Debug: debug
  Release: release
  AppStore: release
  AppStoreDebug: debug
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    ARCHS: arm64
    DEVELOPMENT_TEAM: 3352WVT944
    ENABLE_HARDENED_RUNTIME: YES
    # Rust's standard library comes with networking that nothing calls, and this removes it.
    DEAD_CODE_STRIPPING: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # A real identity keeps TCC grants stable across rebuilds.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
  configs:
    # Can't change after release, because keychain items and permissions depend on it.
    Release:
      ELODIE_BUNDLE_ID: com.kenansulayman.elodie
    AppStore:
      ELODIE_BUNDLE_ID: com.kenansulayman.elodie
    Debug:
      ELODIE_BUNDLE_ID: com.kenansulayman.elodie.dev
    AppStoreDebug:
      ELODIE_BUNDLE_ID: com.kenansulayman.elodie.dev
packages:
  ElodieKit:
    path: Packages/ElodieKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  Elodie:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "LaunchAgents/**"
      - path: Widgets/RecordingChannel.swift
      - path: App/LaunchAgents
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ELODIE_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Elodie.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
        AppStore:
          CODE_SIGN_ENTITLEMENTS: App/ElodieAppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ELODIE_APP_STORE
          EXCLUDED_SOURCE_FILE_NAMES: com.kenansulayman.elodie.agent.plist
        AppStoreDebug:
          CODE_SIGN_ENTITLEMENTS: App/ElodieAppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG ELODIE_APP_STORE
          EXCLUDED_SOURCE_FILE_NAMES: com.kenansulayman.elodie.agent.plist
    dependencies:
      - package: ElodieKit
        product: CoreAPI
      - package: ElodieKit
        product: CoreLive
      - package: ElodieKit
        product: DesignSystem
      - package: ElodieKit
        product: Capture
      - package: ElodieKit
        product: Ingest
      - package: ElodieKit
        product: TestKit
      - package: ElodieKit
        product: CoreFake
      - package: ElodieKit
        product: FrameEngine
      - package: ElodieKit
        product: OverlayShell
      - package: ElodieKit
        product: StripRenderer
      - package: ElodieKit
        product: FeatureTimeline
      - package: ElodieKit
        product: FeatureSearch
      - package: ElodieKit
        product: FeatureOnboarding
      - package: ElodieKit
        product: FeatureSettings
      - package: ElodieKit
        product: FeatureAsk
      - package: ElodieKit
        product: FeatureMeetings
      - package: ElodieKit
        product: Audio
      - package: ElodieKit
        product: FeatureRecap
      - package: KeyboardShortcuts
      - target: ElodieWidgets
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Build Rust core
        basedOnDependencyAnalysis: false
        script: |
          profile=debug
          case "$CONFIGURATION" in Release|AppStore) profile=release ;; esac
          "$SRCROOT/scripts/build-core.sh" "$profile"
  ElodieWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ELODIE_BUNDLE_ID).controls
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/ElodieWidgets.entitlements
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
schemes:
  Elodie:
    build:
      targets:
        Elodie: all
    run:
      config: Debug
    archive:
      config: Release
  Elodie App Store:
    build:
      targets:
        Elodie: all
    run:
      config: AppStoreDebug
    archive:
      config: AppStore
