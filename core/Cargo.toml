[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
remind-vault = { path = "crates/vault" }
remind-engine = { path = "crates/engine" }
remind-store = { path = "crates/store" }
remind-text = { path = "crates/text" }
remind-search = { path = "crates/search" }
remind-timeline = { path = "crates/timeline" }

rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
uniffi = "0.32"
zstd = "0.14"
rayon = "1.12"
crossbeam-channel = "0.5"
chacha20poly1305 = "0.11"
blake3 = "1.8"
unicode-segmentation = "1.13"
unicode-normalization = "0.1"
rust-stemmers = "1.2"
thiserror = "2"
tempfile = "3"
proptest = "1"
roaring = "0.12"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Development builds are optimised, and keep their debug info and overflow checks. Reading
# recordings means decrypting them, and unoptimised, a group of frames took 240 ms to read
# instead of 8 ms, which made scrubbing feel broken and benchmarks meaningless. The cipher's
# generic code gets compiled into these crates, so optimising dependencies alone isn't enough.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
debug = "line-tables-only"
